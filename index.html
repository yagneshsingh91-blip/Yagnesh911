{id:'associate-fdd',title:'Associate – Financial Due Diligence',team:'Financial Due Diligence',location:'Mumbai, India',experience:'CA Fresher (2026 batch)',status:'Draft',summary:'Transaction advisory opportunity for qualified chartered accountants with statutory audit exposure.',requirements:['Qualified Chartered Accountant, preferably 2026 batch','Statutory audit exposure during articleship','Strong financial statement analysis and Excel skills','Mumbai-based candidates preferred'],responsibilities:['Assist in financial due diligence and quality of earnings analysis','Review financial statements, working capital and key financial trends','Support transaction reports and client deliverables'],overview:"Financial due diligence of target businesses, with particular emphasis on quality of earnings, cash flow, working capital and balance sheet exposures.",detailedResponsibilities:["Analyze historical P&L, balance sheet and cash flow statements and reconcile supporting schedules.", "Prepare normalized EBITDA and quality-of-earnings analyses; identify one-offs and non-recurring items.", "Assess net debt, debt-like items and working-capital trends.", "Review revenue, customer concentration, costs, margins and related-party transactions.", "Support data-room requests, management Q&A, issue tracking and drafting diligence reports.", "Maintain workpapers and communicate findings to the engagement manager."],detailedRequirements:["Qualified CA; 2026 batch preferred for the discussed opening.", "Articleship exposure to statutory audit and financial statement testing.", "Advanced Excel, analytical writing and attention to detail.", "Ability to work to transaction deadlines and manage confidential information."]},

{id:'analyst-project-monitoring',title:'Analyst – Real Estate Project Monitoring',team:'Real Estate',location:'Mumbai, India',experience:'B.Com / MBA / CFA or relevant experience',status:'Draft',summary:'Work on real estate project monitoring and reporting.',requirements:['B.Com, MBA, CFA or relevant experience','Strong analytical and reporting skills'],responsibilities:['Assist with project progress and financial monitoring','Prepare periodic analysis and reporting','Coordinate documentation and review'],overview:"Support independent monitoring of real estate project progress, budgets and financial performance.",detailedResponsibilities:["Track construction milestones, project costs, budgets and utilization of funds.", "Compare actual project progress with approved timelines and identify variances.", "Review project MIS, invoices, supporting documents and cash-flow projections.", "Prepare monitoring dashboards, exception reports and client presentations.", "Coordinate with project teams to obtain timely project information."],detailedRequirements:["B.Com, MBA, CFA or relevant project/finance experience.", "Strong Excel, reporting and numerical analysis skills.", "Interest in real estate development, project finance and cost monitoring.", "Ability to follow up with stakeholders and document observations."]},

{id:'assistant-manager-tax',title:'Assistant Manager – Tax',team:'Tax & Compliance',location:'India',experience:'Relevant tax experience',status:'Draft',summary:'Support tax advisory and compliance engagements.',requirements:['Relevant taxation background','Good analytical and communication skills'],responsibilities:['Coordinate tax deliverables','Review documentation and reporting'],overview:"Support UAE-focused tax compliance and advisory delivery from India.",detailedResponsibilities:["Coordinate tax compliance workplans and review supporting schedules.", "Research VAT or corporate tax questions as applicable to the assigned team.", "Prepare technical summaries, client reports and review-ready workpapers.", "Support client follow-ups and supervise junior analysts."],detailedRequirements:["Relevant VAT and/or corporate tax experience aligned to assigned practice.", "Strong Excel, technical research and communication skills.", "Ability to manage multiple deadlines and work with cross-border teams."]},

{id:'senior-associate-debt-syndication',title:'Senior Associate – Debt Syndication',team:'Corporate Finance',location:'India',experience:'Relevant debt syndication experience',status:'Draft',summary:'Support fundraising, lender engagement and debt advisory.',requirements:['Experience in debt syndication or credit analysis','Strong financial modeling and presentation skills'],responsibilities:['Prepare lender information memoranda','Support credit analysis and lender coordination'],overview:"Support structured debt raising and lender coordination for corporate clients.",detailedResponsibilities:["Analyze borrower financial statements, cash flows and debt servicing capacity.", "Build financial models and evaluate financing structures and covenant implications.", "Prepare lender presentations, credit notes and information memoranda.", "Coordinate lender outreach, queries, term sheets and documentation.", "Track deal progress and maintain accurate client and lender information."],detailedRequirements:["Relevant experience in debt syndication, corporate banking or credit advisory.", "Strong credit analysis, financial modeling and PowerPoint skills.", "Ability to coordinate effectively with clients and financial institutions."]},
{id:'company-secretary',title:'Company Secretary',team:'Corporate Services',location:'India',experience:'Relevant CS experience',status:'Draft',summary:'Corporate secretarial and compliance opportunity.',requirements:['Qualified Company Secretary','Knowledge of corporate compliance and governance','Business development aptitude'],responsibilities:['Manage secretarial compliance deliverables','Coordinate client and regulatory documentation','Support business development'],overview:"Deliver corporate secretarial, governance and compliance services to clients.",detailedResponsibilities:["Manage statutory registers, board and shareholder meeting documentation.", "Coordinate company law filings and maintain compliance calendars.", "Advise on routine corporate governance and secretarial requirements.", "Prepare resolutions, minutes, registers and client correspondence.", "Build client relationships and support proposals and business development."],detailedRequirements:["Qualified Company Secretary.", "Practical knowledge of company law, filings and governance procedures.", "Strong documentation, client communication and organizational skills."]},

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const app=document.getElementById('app');const base=location.href.split('#')[0];const link=j=>base+'#job/'+j.id;const email='';const isOpen=j=>j.status==='Open';function card(j){return `<article class="job"><span class="pill">${esc(j.team)}</span> <span class="pill" style="background:${isOpen(j)?'#e4f8ec':'#f0f0f0'};color:${isOpen(j)?'#126534':'#555'}">${isOpen(j)?'Open':'Closed'}</span><h3>${esc(j.title)}</h3><p class="muted">📍 ${esc(j.location)} · ${esc(j.experience)}</p><p>${esc(j.summary)}</p><div class="actions"><a class="btn" href="#job/${j.id}">View JD →</a><button class="secondary" onclick="share('${j.id}')">Copy link</button></div></article>`}function share(id){const j=jobs.find(x=>x.id===id);const u=link(j);if(navigator.clipboard&&location.protocol==='https:')navigator.clipboard.writeText(u).then(()=>alert('JD link copied')).catch(()=>prompt('Copy JD link:',u));else prompt('Copy JD link:',u)}function copyApplication(id){const j=jobs.find(x=>x.id===id);const t="Application – "+j.title; if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("Application subject copied. Please send your CV to the HR contact provided with this JD."));else prompt("Copy application subject",t)}function home(){app.innerHTML=`<section class="hero"><div class="tag" style="color:#ffced7">Discover your next opportunity</div><h1>Build your career with Acquisory</h1><p>Explore opportunities across financial due diligence, real estate, taxation, corporate finance and corporate services. Curated by <b>Yagnesh Singh, HR Head at Acquisory.</b></p></section><main class="wrap"><div class="intro"><div><h2>Explore Job Descriptions</h2><p class="muted">Browse the complete JD library, filter by vacancy status, and share each role with candidates.</p></div><span class="pill">${jobs.length} role profiles · ${jobs.filter(isOpen).length} open</span></div><div class="notice">Role descriptions are working drafts consolidated from previous hiring requirements. HR should review and approve the wording before sharing externally. Only roles marked Open are currently advertised as vacancies.</div><div class="filters"><input id="search" placeholder="Search by role or keyword" aria-label="Search jobs"><select id="location"><option value="">All locations</option><option>Mumbai</option><option>Dubai</option><option>India</option></select><select id="status"><option value="">All statuses</option><option value="Open">Open</option><option value="Closed">Closed</option></select><select id="team"><option value="">All departments</option>${[...new Set(jobs.map(x=>x.team))].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="grid" id="jobs">${jobs.map(card).join('')}</div></main>`;const filter=()=>{const q=document.getElementById('search').value.toLowerCase(),l=document.getElementById('location').value,t=document.getElementById('team').value,st=document.getElementById('status').value;const arr=jobs.filter(j=>(!st|| (isOpen(j)?'Open':'Closed')===st)&&(j.title+' '+j.team+' '+j.summary).toLowerCase().includes(q)&&(!l||j.location.includes(l))&&(!t||j.team===t));document.getElementById('jobs').innerHTML=arr.length?arr.map(card).join(''):'No matching job descriptions.'};['search','location','team','status'].forEach(x=>document.getElementById(x).addEventListener('input',filter))}function detail(id){const j=jobs.find(x=>x.id===id);if(!j)return home();document.title=j.title+' | Acquisory Careers';app.innerHTML=`<main class="wrap"><a href="#" style="color:#a71930">← All Job Descriptions</a><article class="detail"><span class="pill">${esc(j.team)}</span> <span class="pill">${isOpen(j)?'Open':'Closed'}</span><h1>${esc(j.title)}</h1><p class="muted">📍 ${esc(j.location)} &nbsp; | &nbsp; ${esc(j.experience)}</p><div class="notice">Role profile for reference. Vacancy status, eligibility and final terms must be confirmed with HR before applying.</div><h2>About the opportunity</h2><p>${esc(j.overview||j.summary)}</p><h2>Key responsibilities</h2><ul>${(j.detailedResponsibilities||j.responsibilities).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>Qualifications &amp; skills</h2><ul>${(j.detailedRequirements||j.requirements).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="actions"><button onclick="share('${j.id}')">Copy this JD link</button><button class="secondary" onclick="copyApplication('${j.id}')">Copy application subject</button></div><p class="muted">Recruitment contact: Yagnesh Singh · HR Head, Acquisory. Please contact the recruiter sharing this profile to obtain the application address.</p></article></main>`}function route(){const id=decodeURIComponent(location.hash.slice(5));if(location.hash==='#admin')admin();else if(location.hash.startsWith('#job/'))detail(id);else{document.title='Careers | Yagnesh Singh · Acquisory';home()}}
let adminPassword='';
async function loadStatuses(){try{const r=await fetch('/.netlify/functions/statuses',{cache:'no-store'});if(!r.ok)throw Error('API unavailable');const statuses=await r.json();jobs.forEach(j=>j.status=statuses[j.id]||'Closed');}catch(e){jobs.forEach(j=>j.status='Closed');console.warn('Live statuses unavailable',e)}route()}
function admin(){document.title='Manage Job Status | Acquisory';app.innerHTML=`<main class="wrap"><a href="#">← Careers website</a><article class="detail"><h1>Recruitment Admin</h1><p>Manage which JDs are open or closed. Changes are saved to Netlify and reflected on the public website.</p><div class="admin-toolbar"><label><strong>Admin password</strong> <input type="password" id="adminpass" autocomplete="off" placeholder="Enter your Netlify admin password" value="${esc(adminPassword)}" style="display:block;margin:9px 0"></label><p class="muted" style="margin:0">Enter password here before clicking Save. This field stays visible while you scroll.</p><p id="adminmsg" role="status" style="font-weight:700;color:#a71930"></p></div><div id="adminrows">${jobs.map(j=>`<div class="adminrow"><div><b>${esc(j.title)}</b><div class="muted">${esc(j.location)} · ${esc(j.team)}</div></div><select id="state-${j.id}" aria-label="Status for ${esc(j.title)}"><option ${!isOpen(j)?'selected':''}>Closed</option><option ${isOpen(j)?'selected':''}>Open</option></select><button onclick="saveStatus('${j.id}')">Save</button></div>`).join('')}</div></article></main>`}
async function saveStatus(id){const msg=document.getElementById('adminmsg');const password=document.getElementById('adminpass').value;const status=document.getElementById('state-'+id).value;if(!password){msg.textContent='Enter admin password first.';return;}msg.textContent='Saving…';try{const r=await fetch('/.netlify/functions/statuses',{method:'POST',headers:{'content-type':'application/json','x-admin-password':password},body:JSON.stringify({id,status})});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not save');adminPassword=password;jobs.find(j=>j.id===id).status=status;msg.textContent='Saved: '+jobs.find(j=>j.id===id).title+' → '+status;}catch(e){msg.textContent='Not saved: '+e.message}}
addEventListener('hashchange',route);loadStatuses();
