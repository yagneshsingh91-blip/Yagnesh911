function hero(){return `<section class="hero"><div class="wrap"><div class="eyebrow">Acquisory · Talent & Careers</div><h1>Build your career with Acquisory.</h1><p>Explore meaningful opportunities in transaction advisory, corporate finance, real estate, tax and regulatory services across India and the UAE.</p><div class="identity">Curated by <strong>Yagnesh Singh</strong> · HR Head at Acquisory</div></div></section>`}

function home(){app.innerHTML=hero()+`<main class="main wrap"><div class="sectiontop"><div><div class="eyebrow" style="color:var(--red)">Current opportunities</div><h2>Explore open positions</h2></div><span class="muted" id="count"></span></div>${!statusLoaded?`<div class="alert">${esc(statusError||'Loading live vacancy status…')}</div>`:''}<div class="filters"><input id="search" aria-label="Search jobs" placeholder="Search by job title, skill or location"><select id="team"><option value="">All departments</option>${[...new Set(JOBS.map(j=>j.team))].sort().map(t=>`<option>${esc(t)}</option>`).join('')}</select><select id="location"><option value="">All locations</option><option value="India">India</option><option value="Dubai">Dubai / UAE</option><option value="Remote">Remote support</option></select></div><div id="cards" class="cards"></div></main>`;function update(){let q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('team').value,l=document.getElementById('location').value;let a=JOBS.filter(j=>statusLoaded&&state(j)==='Open'&&(!t||j.team===t)&&(!l||(l==='Remote'?j.mode.toLowerCase().includes('remote'):l==='Dubai'?j.location.includes('Dubai'):j.location.includes('India')))&&[j.title,j.team,j.location,j.overview,j.experience].join(' ').toLowerCase().includes(q));document.getElementById('cards').innerHTML=a.length?a.map(card).join(''):`<div class="empty" style="grid-column:1/-1">${statusLoaded?'No open positions match your filters.':'Open positions cannot be displayed until the status service is available.'}</div>`;document.getElementById('count').textContent=a.length+' open position'+(a.length===1?'':'s');}['search','team','location'].forEach(id=>document.getElementById(id).addEventListener('input',update));update()}
function detail(id){const j=JOBS.find(j=>j.id===id);if(!j){app.innerHTML=`<main class="main wrap"><div class="panel"><h2>Job not found</h2><a href="#">Return to openings</a></div></main>`;return;}if(!statusLoaded||state(j)!=='Open'){app.innerHTML=`<main class="main wrap"><div class="panel detail"><a href="#">← Back to openings</a><h1>Position currently unavailable</h1><p>This vacancy is not currently advertised. Please visit our open positions for other opportunities.</p></div></main>`;return;}app.innerHTML=`<main class="main wrap"><div class="detail panel"><a href="#">← All open positions</a><div class="tag" style="margin-top:26px">${esc(j.team)}</div><h1>${esc(j.title)}</h1><div class="info"><span class="pill">📍 ${esc(j.location)}</span><span class="pill">Experience: ${esc(j.experience)}</span><span class="pill">${esc(j.mode)}</span></div><div class="actions"><a class="btn" href="mailto:yagnesh.singh@acquisory.com?subject=${encodeURIComponent('Application – '+j.title)}">Apply via email</a><button class="btn alt" id="copy">Copy individual JD link</button></div><h2>Role Overview</h2><p class="intro">${esc(j.overview)}</p><h2>Key Responsibilities</h2>${j.sections.map((sec,i)=>`<h3>${i+1}. ${esc(sec.heading)}</h3><ul>${sec.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}<h2>Qualifications & Skills</h2><ul>${j.qualifications.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>Benefits</h2><ul>${j.benefits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="subtle"><strong>Recruitment Contact</strong><div>Yagnesh Singh · HR Head at Acquisory</div><div><a href="mailto:yagnesh.singh@acquisory.com">yagnesh.singh@acquisory.com</a></div></div></div></main>`;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('copy').textContent='Link copied ✓'}catch{prompt('Copy this link:',location.href)}}}
function admin(){app.innerHTML=`<main class="main wrap"><div class="detail panel"><div class="eyebrow" style="color:var(--red)">Private HR workspace</div><h1>Manage Job Status</h1><p class="muted">All ${JOBS.length} JDs are retained here. Only Open jobs are visible on the public careers website. Status updates are saved to Netlify Blobs.</p><label for="pw"><strong>Admin password</strong></label><div style="display:flex;gap:10px;margin:9px 0 12px;flex-wrap:wrap"><input type="password" id="pw" autocomplete="off" placeholder="Enter your Netlify admin password" style="flex:1;min-width:220px"><button class="btn alt" id="showpw">Show</button></div><div class="alert">Do not share your admin password. This panel manages vacancy status only; full JD text is edited in the website source file.</div>${!statusLoaded?`<div class="alert">${esc(statusError||'Loading live statuses…')}</div>`:''}<div id="notice" aria-live="polite"></div><div class="filters"><input id="adminSearch" placeholder="Filter by job title or department"><select id="adminTeam"><option value="">All departments</option>${[...new Set(JOBS.map(j=>j.team))].sort().map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="subtle" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px"><label style="display:flex;align-items:center;gap:7px"><input type="checkbox" id="selectAll" style="min-height:0"> Select all filtered</label><span id="selectedCount" class="muted">0 selected</span><button class="btn" id="bulkOpen" disabled>Mark selected Open</button><button class="btn alt" id="bulkClosed" disabled>Mark selected Closed</button></div><div id="adminrows"></div></div></main>`;document.getElementById('showpw').onclick=()=>{let p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';document.getElementById('showpw').textContent=p.type==='password'?'Show':'Hide'};const checkedIds=new Set();function selectionUI(){const boxes=[...document.querySelectorAll('.job-check')];const all=document.getElementById('selectAll');all.checked=boxes.length>0&&boxes.every(b=>b.checked);all.indeterminate=boxes.some(b=>b.checked)&&!all.checked;document.getElementById('selectedCount').textContent=checkedIds.size+' selected';document.getElementById('bulkOpen').disabled=document.getElementById('bulkClosed').disabled=!statusLoaded||!checkedIds.size;}function rows(){let q=document.getElementById('adminSearch').value.toLowerCase(),t=document.getElementById('adminTeam').value;document.getElementById('adminrows').innerHTML=JOBS.filter(j=>(!t||j.team===t)&&[j.title,j.team,j.location].join(' ').toLowerCase().includes(q)).map(j=>`<div class="adminrow"><input type="checkbox" class="job-check" data-check="${j.id}" aria-label="Select ${esc(j.title)}" ${checkedIds.has(j.id)?'checked':''} style="min-height:0"><div><strong>${esc(j.title)}</strong><small>${esc(j.location)} · ${esc(j.team)} · <a href="/#job/${encodeURIComponent(j.id)}">Public JD link</a></small></div><select aria-label="Status for ${esc(j.title)}" id="st-${j.id}"><option ${state(j)==='Closed'?'selected':''}>Closed</option><option ${state(j)==='Open'?'selected':''}>Open</option></select><button class="btn" data-save="${j.id}" ${statusLoaded?'':'disabled'}>Save</button></div>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save,b));document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{if(b.checked)checkedIds.add(b.dataset.check);else checkedIds.delete(b.dataset.check);selectionUI()});selectionUI()}document.getElementById('selectAll').onchange=e=>{document.querySelectorAll('[data-check]').forEach(b=>{b.checked=e.target.checked;if(b.checked)checkedIds.add(b.dataset.check);else checkedIds.delete(b.dataset.check)});selectionUI()};async function bulk(status){const pw=document.getElementById('pw').value,n=document.getElementById('notice'),ids=[...checkedIds];if(!pw){n.innerHTML='<div class="alert">Enter your admin password before saving.</div>';document.getElementById('pw').focus();return}if(!statusLoaded||!ids.length)return;document.getElementById('bulkOpen').disabled=document.getElementById('bulkClosed').disabled=true;let done=0,failed=[];n.innerHTML='<div class="alert">Saving '+ids.length+' positions…</div>';for(const id of ids){try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify({id,status})});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw Error(d.error||'HTTP '+r.status);statuses[id]=status;checkedIds.delete(id);done++}catch(e){failed.push(id+': '+e.message);if(runningAuthError(e))break}}n.innerHTML='<div class="alert '+(failed.length?'':'success')+'">'+done+' of '+ids.length+' positions updated to '+esc(status)+'.'+(failed.length?' Failed: '+esc(failed.join('; ')):'')+'</div>';rows()}function runningAuthError(e){return /401|403|password|unauthor/i.test(String(e.message))}document.getElementById('bulkOpen').onclick=()=>bulk('Open');document.getElementById('bulkClosed').onclick=()=>bulk('Closed');['adminSearch','adminTeam'].forEach(id=>document.getElementById(id).addEventListener('input',rows));rows()}
async function save(id,b){let pw=document.getElementById('pw').value;let n=document.getElementById('notice');if(!pw){n.innerHTML='<div class="alert">Enter your admin password before saving.</div>';document.getElementById('pw').focus();return;}if(!statusLoaded){n.innerHTML='<div class="alert">Status service is unavailable. Nothing has been saved.</div>';return;}const selected=document.getElementById('st-'+id).value;b.disabled=true;b.textContent='Saving…';try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify({id,status:selected})});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw Error(d.error||'HTTP '+r.status);statuses[id]=selected;n.innerHTML='<div class="alert success">Saved '+esc(selected)+' successfully. The public site will reflect the change on refresh.</div>';b.textContent='Saved ✓';setTimeout(()=>{if(b.isConnected)b.textContent='Save'},1800)}catch(e){n.innerHTML='<div class="alert">Save failed: '+esc(e.message)+'. No change was confirmed.</div>';b.textContent='Save'}finally{b.disabled=false}}
